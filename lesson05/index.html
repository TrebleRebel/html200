<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>Square Numbers</title>
    </head>

    <body>
        <button onclick="let number = prompt('Enter a Number: ')

            function square(numberToSquare) {
            return numberToSquare ** 2;
            }

            alert(square(number))">Square Number</button>
    </body>

</html>
