<!DOCTYPE html>
<html lang="en" >
    <head>
        <meta charset="utf-8">
        <title>Card</title>
        <link rel="stylesheet" type="text/css" href="main.css">
        <script src="https://kit.fontawesome.com/ea59f88f5b.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <div>
            <main>
                <img src="card-image.png" width="80%">
                <h2>Steve Smith</h2>
                <p class="italics">Project Manager</p>
            
            </div>
            
            <div>
            <aside>
                <p><span class="bold">Company: </span><span>Front End Dev Co</span></p>
                <p><span class="bold">Experience: </span><span>3 Years</span></p>
                <p><span class="bold">School: </span><span>UW</span></p>
                <p><span class="bold">Major: </span><span>Marketing</span></p>
                <p><span class="bold">Email: </span><span>steve@fedc.com</span></p>
                <p><i class="fa-brands fa-linkedin fa-2x" style="vertical-align: middle;"></i>steve.linkedinprofile.com</p>
            </aside>
            </div>
            </main>
        </div>
    </body>
